name: ci

on:
  push:
    branches: [main]
  pull_request:

# This workflow only checks out and tests. Default token scope is broader
# than that, so it is narrowed here at workflow level; every job inherits it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # Type stripping for hooks/bw-deny-files.ts, so node --test can import
      # the extension directly rather than through a build step.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Syntax-check shell sources
        run: bash -n install.sh bw-common.sh claude-bw.sh opencode-bw.sh pi-bw.sh hooks/bw-deny-files.sh test/install_hooks_test.sh test/integration_test.sh

      # gofmt is the first thing a reader of a public Go repo runs, and two
      # files on this branch were unformatted. Cheap to check, so check it.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l reported unformatted files:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: Go tests
        run: go test ./...

      - name: pi extension tests
        run: node --test hooks/bw-deny-files.test.ts

      # Guards the deny-hook ownership rules in install.sh steps 4 and 6.
      # Overwriting aiCodingBaseSetup's hardened hook silently downgrades an
      # always-on secrets guard to a sandbox-only one, which is invisible in
      # the installer's output — so it has to be a machine check.
      - name: Installer hook ownership
        run: test/install_hooks_test.sh

      # Actually RUNS the guard's integration suite instead of only
      # syntax-checking it above. This is what exercises Test 0b (the
      # compose-harvest regression gate) and Test 0c (--no-trunc container-ID
      # seeding against a real daemon) — neither ran in CI before. Individual
      # subtests SKIP (exit 2) when Docker or a needed image is missing;
      # ubuntu-latest ships Docker, so this should not skip, but a silent
      # skip is nearly as bad as no test, so the skip count is surfaced as a
      # workflow warning rather than swallowed.
      - name: Docker guard integration tests
        run: |
          set -o pipefail
          bash test/integration_test.sh | tee /tmp/integration_test.log
          summary="$(grep -E '^=== Results:' /tmp/integration_test.log || true)"
          echo "$summary"
          skipped="$(grep -oE '[0-9]+ skipped' /tmp/integration_test.log | grep -oE '^[0-9]+' || echo 0)"
          if [ "${skipped:-0}" -gt 0 ]; then
            echo "::warning::$skipped integration test(s) SKIPPED (Docker or a required image was unavailable) — this run did not exercise them"
          fi
